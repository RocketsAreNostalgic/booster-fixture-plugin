name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Characterize and build the release contract
        run: bash scripts/test-release-contract.sh
