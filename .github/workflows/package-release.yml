name: Package Release Please completion

on:
  workflow_run:
    workflows:
      - Release Please
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: package-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  package-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: release
        name: Resolve the exact release tag
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mapfile -t tags < <(git tag --points-at "$RELEASE_SHA" --list 'v*')
          if (( ${#tags[@]} == 0 )); then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          (( ${#tags[@]} == 1 )) || {
            echo "Expected one release tag at $RELEASE_SHA." >&2
            exit 1
          }
          version=${tags[0]#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          {
            echo "found=true"
            echo "tag=${tags[0]}"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Build exact release assets
        if: steps.release.outputs.found == 'true'
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: bash scripts/build-release.sh "$RELEASE_SHA" "$RELEASE_VERSION"
      - name: Upload or verify release assets
        if: steps.release.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          bash scripts/upload-release-assets.sh \
            "$RELEASE_TAG" \
            "build/booster-fixture-plugin-$RELEASE_VERSION.zip" \
            "build/booster-fixture-plugin-$RELEASE_VERSION.json"
